<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- card with contents -->
        <div class="card my-4">
            <div class="card-body">
                <h4 class="card-title text-center">Title</h4>
                <p class="card-text">Content.</p>
                <a href="#" class="card-link">Card link</a>
                <a href="#" class="card-link">Card link 2</a>
            </div>
        </div>

        <!-- card with image -->
         <p class="text-center text-capitalize lead">Image on card - top</p>
         <div class="card d-flex">
            <img class="card-img-top" src="pictures/image.png" alt="Card image" style="width:100%">

            <div class="card-body align" >
                <h4 class="card-title">AMG ONE</h4>
                <p class="card-text">Some text</p>
                <a href="#" class="btn btn-primary text-uppercase">Amg</a>
            </div>
         </div>
          <p class="text-center text-capitalize lead mt-4">Image on card - bottom</p>
         <div class="card d-flex mt-4">
            <div class="card-body align" >
                <h4 class="card-title text-lowercase display-3 text-center">AMG ONE</h4>
                <p class="card-text text-center">Some text</p>
                <a href="#" class="btn btn-secondary text-uppercase">Amg</a>
            </div>
            <img class="card-img-bottom" src="pictures/image.png" alt="Card image" style="width:100%">

         </div>


         <!-- stretched link -->
          <p class="lead text-center text-capitalize mt-4">image on card</p>
          <div class="card">
            <div class="card-body">
                <img class="card-img-bottom rounded" src="pictures/image.png" alt="Card image" style="width:100%">
                <h4 class="card-title text-lowercase display-3 text-center">AMG ONE</h4>
                <p class="card-text text-center">Some text</p>
                <a href="#" class="btn btn-secondary stretched-link text-uppercase">Amg</a>

            </div>

          </div>

    </div>
</body>
</html>
