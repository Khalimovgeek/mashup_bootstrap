<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Grid System</title>
</head>
<body>
    <!-- row and column example -->
    <!-- .col with equal width -->
        <div class="container-fluid">
            <h1>Three equal width columns</h1>
            <div class="row">
                <div class="col" style="background-color:pink;">.col</div>
                <div class="col" style="background-color:blue;">.col</div>
                <div class="col" style="background-color:orange;">.col</div>
            </div>
        </div>
    <!-- .col with custom width -->
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-10" style="background-color: pink;">.col</div>
                <div class="col-sm-2" style="background-color: blue;">.col</div>
            </div>
        </div>
</body>
</html>
