<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body class="bg-light">
   <div class="container text-center">
        <div class="card my-4 py-3">
            <div class="card-body">Text inside card</div>
        </div>
        <div class="card  my-4">
            <div class="card-body">Basic card</div>
        </div>

        <div class="card bg-primary my-4">
            <div class="card-body">Primary card</div>
        </div>
        <div class="card bg-secondary my-4">
            <div class="card-body">Secondary card</div>
        </div>
        <div class="card bg-info my-4">
            <div class="card-body">Info card</div>
        </div>
        <div class="card bg-warning my-4">
            <div class="card-body">Warning card</div>
        </div>

        <div class="card bg-danger  my-4">
            <div class="card-body">Danger card</div>
        </div>

        <div class="card bg-success  my-4">
            <div class="card-body">Success card</div>
        </div>

        <div class="card bg-dark text-white  my-4">
            <div class="card-body">Dark card</div>
        </div>

        <div class="card bg-light text-dark  my-4">
            <div class="card-body">Light card</div>
        </div>
   </div> 
   <!-- header footer cards -->
    <div class="container">
        <div class="card text-center">
            <div class="card-header bg-danger text-white">Header</div>
            <div class="card-body">card-body</div>
            <div class="card-footer bg-dark text-white"> Footer </div>
        </div>
    </div>
    
</body>
</html>
