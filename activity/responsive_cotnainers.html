<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Containers</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
    <div style="background-color: aqua;" class="container-sm">100% wide until small breakpoint(<576px)</div>
    <div style="background-color: blanchedalmond;" class="container-md">100% wide until medium breakpoint(>=576px)</div>
    <div style="background-color: cornsilk;" class="container-lg">100% wide until large breakpoint(>=768px)</div>
    <div style="background-color: violet;" class="container-xl">100% wide until extra large breakpoint(>=992px)</div>
</body>
</html>
