<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdwon</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <div class ="dropdown">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item" href="#">Bootstrap</a>
            </div>
        </div>
        <div class ="dropdown mt-5">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu">
                <a class="dropdown-item active" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item disabled" href="#">Bootstrap</a>
            </div>
        </div>
        <div class ="dropdown mt-5">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item" href="#">Bootstrap</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#">Database</a>
            </div>
        </div>
        <div class ="dropdown mt-5">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu">
                <h4 class="dropdown-header">Header</h4>
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item" href="#">Bootstrap</a>
            </div>
        </div>
        <div class ="dropdown dropleft mt-5">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item" href="#">Bootstrap</a>
            </div>
        </div>

        <div class ="dropdown mt-5 dropright">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item" href="#">Bootstrap</a>
            </div>
        </div>
        <div class ="dropdown my-5">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu dropdown-menu-right">
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item" href="#">Bootstrap</a>
            </div>
        </div>

        <div class ="dropup my-5">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item" href="#">Bootstrap</a>
            </div>
        </div>
        <div class ="dropdown">
            <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Front end</button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item active" href="#">CSS</a>
                <a class="dropdown-item disabled" href="#">Bootstrap</a>
                <a class="dropdown-item-text" href="#">Text Link</a>
                <span class="dropdown-item-text">Text</span>
            </div>
        </div>
        <div class="btn-group mt-5">
            <button type="button" class="btn btn-info">Front end</button>
            <button type="button" class="btn btn-info">Backend</button>
            <div class="btn-group">
                <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Database</button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="#">Mysql</a>
                    <a class="dropdown-item active" href="#">Oracle</a>
                    <a class="dropdown-item disabled" href="#">Nosql</a>
                </div>
            </div>
        </div>

        <div class="btn-group-vertical">
            <button type="button" class="btn btn-info">Front end</button>
            <button type="button" class="btn btn-info">Backend</button>
            <div class="btn-group">
                <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">Database</button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="#">Mysql</a>
                    <a class="dropdown-item active" href="#">Oracle</a>
                    <a class="dropdown-item disabled" href="#">Nosql</a>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-info">Frontend</button>
            <button type="button" class="btn btn-info dropdown-toggle dropdown-toggle-split" data-toggle="dropdown">
            </button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">HTML</a>
                <a class="dropdown-item" href="#">CSS</a>
                <a class="dropdown-item" href="#">Bootstrap</a>
            </div>
        </div>
    </div>


</body>
</html>
