<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    
    <div class="container">
        <div class="form-group">
            <label for="usr">Name</label>
            <input type="text" class="form-control" name="usr" id="usr">
        </div>
        <div class="form-group">
            <label for="pwd">Password:</label>
            <input type="password" class="form-control" id="pwd" Placeholder="Enter Password">
        </div>
        <!-- text area -->
         <div class="form-group">
            <label for="comment">Comment</label>
            <textarea id="comment" class="form-control" rows="3"></textarea>
         </div>
         <div class="form-check-inline">
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input" value="">Option 1
            </label>
         </div>
         <div class="form-check-inline">
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input" value="">Option 2
            </label>

         </div>
         <div class="form-check-inline">
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input " disabled value="">Option 3
            </label>
         </div>
         <br>
         <div class="form-check-inline">
            <label class="form-check-label">
                <input type="radio" class="form-check-input " value="">Option 1
            </label>
         </div>
         <div class="form-check-inline">
            <label class="form-check-label">
                <input type="radio" class="form-check-input " value="">Option 2
            </label>
         </div>
         <div class="form-check-inline">
            <label class="form-check-label">
                <input type="radio" class="form-check-input " disabled value="">Option 3
            </label>
         </div>


         <div class="form-group">
            <label for="sel1">Select one:</label>
            <select class="form-control" id="sel1">
                <option>HTML</option>
                <option>CSS</option>
                <option>Bootstrap</option>
                <option>Javascript</option>
            </select>
        </div>


        <div class="form-group">
            <input type="text" class="my-3 form-control form-control-sm"placeholder="small form control">
            <input type="text" class="my-3 form-control form-control"placeholder="Medium or default form control">
            <input type="text" class="my-3 form-control form-control-lg"placeholder="Large form control">
        </div>
        <div class="form-group">
            <input type="text" class="form-control-plaintext" placeholder="Form control with plaintext">
        </div>
        <div class="form-group">
            <input type="range" class="form-control-range" name="range">
        </div>
        <div class="form-group">
            <input type="file" class="form-control-file border " name="file">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </div>
    
</body>
</html>
