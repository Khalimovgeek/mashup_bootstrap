<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap images</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container text-center">
        <!-- rounded image;borders get rounded -->
         <h2><small>rounded image</small></h2>
        <img src="https://static.toiimg.com/thumb/msid-92521599,width-748,height-499,resizemode=4,imgsize-117844/.jpg" class="rounded" alt="Nature">

        <!-- circle image; circle depends on the image size -->
         <h2><small>rounded image</small></h2>
         <img src="https://static.toiimg.com/thumb/msid-92521599,width-748,height-499,resizemode=4,imgsize-117844/.jpg" width="300px" height="300px" class="rounded-circle" alt="Fort">

        <!-- thumbnail image -->
         <h2><small>Thumbbnail Image</small></h2>
         <img src="https://t4.ftcdn.net/jpg/05/54/52/13/360_F_554521329_ngmDQSjSrUSRnbK2xK0bkcprsinG9Xdv.jpg" class="img-thumbnail" alt="Panda">
         
         <!-- image align -->
          <h3><small>Image align using .float-left and .float-right</small></h3>
          <img src="https://t4.ftcdn.net/jpg/05/54/52/13/360_F_554521329_ngmDQSjSrUSRnbK2xK0bkcprsinG9Xdv.jpg" width="200px" class="float-left" alt="Panda">
          <img src="https://t4.ftcdn.net/jpg/05/54/52/13/360_F_554521329_ngmDQSjSrUSRnbK2xK0bkcprsinG9Xdv.jpg" width="200px" class="float-right" alt="Panda">
        
          <!-- image align center -->
            <img src="https://i.redd.it/having-trouble-figuring-out-this-cat-breed-v0-yi9pd0pjpatc1.jpg?width=1290&format=pjpg&auto=webp&s=c29417b85c794c08250425582f041006dc2419ae" class="mx-auto d-block"  width="320" height="276">
        <h1><small>Responsive image</small></h1>
        <img src="https://i.redd.it/having-trouble-figuring-out-this-cat-breed-v0-yi9pd0pjpatc1.jpg?width=1290&format=pjpg&auto=webp&s=c29417b85c794c08250425582f041006dc2419ae" class="mx-auto d-block img-fluid"  >
        </div>
</body>
</html>
