<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <!-- buttons -->
    <div class="container d-flex flex-column">
        <button type = "button" class = "btn ">Basic Button</button>
        <button type = "button" class = "btn btn-primary">Primary Button</button>
        <button type = "button" class = "btn btn-secondary">Secondary Button</button>
        <button type = "button" class = "btn btn-success">Success Button</button>
        <button type = "button" class = "btn btn-danger">Danger Button</button>
        <button type = "button" class = "btn btn-warning">Warning Button</button>
        <button type = "button" class = "btn btn-info">Info Button</button>
        <button type = "button" class = "btn btn-light">Light Button</button>
        <button type = "button" class = "btn btn-dark">Dark Button</button>
        <button type = "button" class = "btn btn-link">Link Button</button>
    </div>

    <!-- inline buttons -->
     <div class="container d-block">
        <button type = "button" class = "btn btn-outline-primary m-2">Primary Button</button>
        <button type = "button" class = "btn btn-outline-secondary m-2">Secondary Button</button>
        <button type = "button" class = "btn btn-outline-success m-2">Success Button</button>
        <button type = "button" class = "btn btn-outline-danger m-2">Danger Button</button>
        <button type = "button" class = "btn btn-outline-light text-dark m-2">Light Button</button>
        <button type = "button" class = "btn btn-outline-warning m-2">Warning Button</button>
        <button type = "button" class = "btn btn-outline-info m-2">Info Button</button>
        <button type = "button" class = "btn btn-outline-dark m-2">Dark Button</button>
     </div>

     <!-- button size  -->
      <div class="container d-block mt-4 ">
        <button type="button" class="btn btn-outline-danger btn-lg">Stop</button>
        <button type="button" class="btn btn-outline-warning">reset</button>
        <button type="button" class="btn btn-outline-success btn-sm">Start</button>
      </div>

    <!-- block level button -->
     <div class="container d-flex mt-4">
        <button type="button" class="btn btn-outline-primary btn-block">Block Level Button</button>
     </div>

    <!-- active and disabled button -->
     <div class="container d-block mt-4 ">
        <button type="button" class="btn btn-outline-secondary active">Active Button</button>
        <button type="button" class="btn btn-outline-secondary disabled">Disabled Button</button>
        <a href="#" class="btn btn-outline-info disabled">Disabled Button as Link</a>
     </div>

</body>
</html>
