<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>collapse</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
    <h3 class="lead display-4 text-capitalize text-center">collapse - button</h3>

    <div class="container d-flex  my-3">
        <div class="container-fluid">
            <button data-toggle="collapse" data-target="#demo">Collapsible</button>
            <div id="demo" class="collapse">
                Some text in collapsible
            </div>
        </div>
        <div class="container-fluid">
            <a href="#demo1" data-toggle="collapse">Collapsible</a>
            <div id="demo1" class="collapse">
            Some text in collapsible</div>
        </div>

        <div class="container-fluid">
            <button data-toggle="collapse" data-target="#demo2">Collapsible</button>
<div id="demo2" class="collapse show">Some text in collapsible</div>
        </div>
    </div>
    <div class="container">
        
<div id = "accordion">
            <div class = "card">
               <div class = "card-header">
                  <a class = "card-link" data-toggle = "collapse" href = "#collapseOne">
                     Accordion #1
                  </a>
               </div>
               <div id = "collapseOne" class = "collapse" data-parent = "#accordion">
                  <div class = "card-body">Content for Accordion #1.</div>
               </div>
            </div>
            <div class = "card">
               <div class = "card-header">
                  <a class = "collapsed card-link" data-toggle = "collapse" href = "#collapseTwo">
                     Accordion #2
                  </a>
               </div>
               <div id = "collapseTwo" class = "collapse show" data-parent = "#accordion">
                  <div class = "card-body">Content for Accordion #2.</div>
               </div>
            </div>
            <div class = "card">
               <div class = "card-header">
                  <a class = "collapsed card-link" data-toggle = "collapse" href = "#collapseThree">
                     Accordion #3
                  </a>
               </div>
               <div id = "collapseThree" class = "collapse" data-parent = "#accordion">
                  <div class = "card-body"> Content for Accordion #3.</div>
               </div>
            </div>
         </div>
    </div>
</body>
</html>
