<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap alerts</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
    <!-- alert -->
    <div class="container d-flex flex-column  justify-content-end">
        <div class="alert alert-success text-center px-5 mt-4 mr-3">
            <strong>Success!</strong>
        </div>
        
        <!-- alert with link -->
        <div class="alert alert-success text-center px-5 mt-4 mr-3">
            Welcome to <a href="#" class="alert-link">MashupStack</a>
        </div>

        <!-- dismissal alert -->
        <div class="alert alert-success alert-dismissible text-center px-5 mt-4 mr-3">
            Hi
            <button type="button" class="close text-secondary" data-dismiss="alert">&times;</button>
        </div>

        <!-- animated alert -->
         <div class="alert alert-success alert-dismissible fade show text-center px-5 mt-4 mr-3">
            Hi
            <button type="button" class="close text-secondary" data-dismiss="alert">&times;</button>
         </div>
    </div>
    
</body>
</html>
