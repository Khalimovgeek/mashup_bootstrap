<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
    
    <div class="container-fluid">
        <!-- progress bar -->
        <div class="progress my-4">
            <div class="progress-bar bg-danger" style="width: 50%;"></div>
        </div>

        <!-- progress bar height -->
         <div class="progress my-4" style="height: 30px;">
            <div class="progress-bar" style="width: 35%;height: 30px;"></div>
         </div>

        <!-- progress bar label -->
          <div class="progress my-4">
            <div class="progress-bar" style="width: 50%"> 50% complete </div>
          </div>
        
        <!-- colored progress bar -->
         
        <div class="progress">
            <div class="progress-bar bg-primary" style="width:10%"></div>
        </div>
        <div class="progress">
            <div class="progress-bar bg-secondary" style="width:20%"></div></div>
        <div class="progress">
            <div class="progress-bar bg-success" style="width:30%"></div>
        </div>
        <div class="progress">
            <div class="progress-bar bg-danger" style="width:40%"></div>
        </div>
        <div class="progress">
            <div class="progress-bar bg-warning" style="width:50%"></div>
        </div>
        <div class="progress">
            <div class="progress-bar bg-info" style="width:60%"></div>
        </div>
        <div class="progress">
            <div class="progress-bar bg-dark" style="width:70%"></div>
        </div>
        <div class="progress">
            <div class="progress-bar bg-light" style="width:80%"></div>
        </div>
        <div class="progress">
            <div class="progress-bar bg-white" style="width:90%"></div>
        </div>
    </div>

    <!-- stripped progress bar -->
     
    <div class="progress my-4">
        <div class="progress-bar progress-bar-striped" style="width:50%"></div>
    </div>

    <!-- stripped progress bar animated -->
     
    <div class="progress my-4">
        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:50%"></div>
    </div>    

    <!-- multiple progress bar -->

    <div class="progress">
        <div class="progress-bar bg-primary" style="width:30%">
            Primary
        </div>
        <div class="progress-bar bg-warning" style="width:20%">
            Warning
        </div>
        <div class="progress-bar bg-info" style="width:10%">
            Info
        </div>
    </div>
</body>
</html>
