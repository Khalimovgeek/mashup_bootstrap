<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Feedback</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
    <div class="container border rounded  my-4 py-3">
        <h4 class="text-center display-5">Feedback</h4>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" name="name" id="name" placeholder="Please enter your name">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" name="email" id="email" placeholder="Please enter your email">
        </div>
        <div class="form-group">
            <label for="txt">Feedback Message</label>
            <textarea name="txt" class="form-control" rows="4" placeholder="Please enter your feedback" id="txt"></textarea>
        </div>
        <div class="form-group">
            <label for="drp">How did you hear about us?</label>
            <select class="form-control" id="drp">
                <option value="friends">friends</option>
                <option value="linkedin">linkedin</option>
                <option value="instagram">instagram</option>
            </select>
        </div>
        <label for="form-check-inline">Please rate your experience :</label>
        <div class="form-check-inline">
            <label for="form-check-label">
                1
                <input type="radio" class="form-check-input">
            </label>
        </div>
        <div class="form-check-inline">
            <label for="form-check-label">
                2
                <input type="radio" class="form-check-input">
            </label>
        </div>
        <div class="form-check-inline">
            <label for="form-check-label">
                3
                <input type="radio" class="form-check-input">
            </label>
        </div>
        <div class="form-check-inline">
            <label for="form-check-label">
                4
                <input type="radio" class="form-check-input">
            </label>
        </div>
        <div class="form-check-inline">
            <label for="form-check-label">
                5
                <input type="radio" class="form-check-input">
            </label>
        </div>
        <br>
        <input type="submit" value="Submit" class="d-block mx-auto btn btn-primary">
    </div>
</body>
</html>
