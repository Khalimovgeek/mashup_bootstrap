<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bakery Feedback Form</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Online Bakery Feedback Form
                        </h2>

                        <form action="#">

                            <!-- Name -->
                            <div class="form-group">
                                <label for="name">Customer Name</label>

                                <input type="text"
                                class="form-control"
                                id="name"
                                placeholder="Enter your name"
                                required>
                            </div>

                            <!-- Email -->
                            <div class="form-group">
                                <label for="email">Email Address</label>

                                <input type="email"
                                class="form-control"
                                id="email"
                                placeholder="Enter your email"
                                required>
                            </div>

                            <!-- Feedback -->
                            <div class="form-group">
                                <label for="feedback">
                                    Feedback Message
                                </label>

                                <textarea class="form-control"
                                id="feedback"
                                rows="5"
                                placeholder="Share your experience"
                                required></textarea>
                            </div>

                            <!-- Preferred Contact -->
                            <div class="form-group">
                                <label for="contact">
                                    Preferred Contact Method
                                </label>

                                <select class="form-control" id="contact">
                                    <option>Email</option>
                                    <option>Phone</option>
                                </select>
                            </div>

                            <!-- Satisfaction Level -->
                            <div class="form-group">
                                <label class="d-block">
                                    Satisfaction Level (1–10)
                                </label>

                                <div class="d-flex flex-wrap">

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r1">

                                        <label class="form-check-label" for="r1">
                                            1
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r2">

                                        <label class="form-check-label" for="r2">
                                            2
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r3">

                                        <label class="form-check-label" for="r3">
                                            3
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r4">

                                        <label class="form-check-label" for="r4">
                                            4
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r5">

                                        <label class="form-check-label" for="r5">
                                            5
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r6">

                                        <label class="form-check-label" for="r6">
                                            6
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r7">

                                        <label class="form-check-label" for="r7">
                                            7
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r8">

                                        <label class="form-check-label" for="r8">
                                            8
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r9">

                                        <label class="form-check-label" for="r9">
                                            9
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input"
                                        type="radio"
                                        name="rating"
                                        id="r10">

                                        <label class="form-check-label" for="r10">
                                            10
                                        </label>
                                    </div>

                                </div>
                            </div>

                            <!-- Order Type -->
                            <div class="form-group">
                                <label for="order">
                                    Type of Order
                                </label>

                                <select class="form-control" id="order">
                                    <option>Cake</option>
                                    <option>Cookies</option>
                                    <option>Pastries</option>
                                </select>
                            </div>

                            <!-- Submit Button -->
                            <div class="text-center">
                                <button type="submit"
                                class="btn btn-primary px-5">
                                    Submit
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
