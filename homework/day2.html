<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team | Mashup</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
    <div class="container-fluid">
        <h2 class="my-3">Mashup stack</h2>
        <h4>Our team</h4>
        <blockquote class="lead">
            Teamwork is the fuel that allows ordinary people to achieve extraordinary results.
        </blockquote>
        <div class="container">
            <ul class="list-inline">
                <li class="list-inline-item">Integrity</li>
                <li class="list-inline-item">empathy</li>
                <li class="list-inline-item">accountability</li>
            </ul>
        </div>
        <!-- image -->
        <div class="container-fluid d-flex justify-content-center">
            <img class="rounded-circle" width="60%" src="https://images.pexels.com/photos/5257005/pexels-photo-5257005.jpeg" alt="team">
        </div>
        <!-- table -->
        <div class="container-fluid my-5">
            <table class="table text-capitalize table-bordered">
                <tr>
                    <th>Name</th>
                    <th>role</th>
                    <th>status</th>
                </tr>
                <tr class="table-success">
                    <td>joe</td>
                    <td>devloper</td>
                    <td>active</td>
                </tr>
                <tr class="table-secondary">
                    <td>alice</td>
                    <td>hr</td>
                    <td>on leave</td>
                </tr>
                <tr class="table-danger">
                    <td>jack</td>
                    <td>intern</td>
                    <td>resigned</td>
                </tr>
            </table>
        </div>

        <!-- alert -->
         <div class="alert alert-danger alert-dismissible text-center px-5 mt-4 mr-3">
            <p>
                Alice is not active
            </p>
            <button type="button" class="close text-secondary" data-dismiss="alert">&times;</button>
        </div>


         <div class="alert alert-danger alert-dismissible text-center px-5 mt-4 mr-3">
            <p>
                Jack is not active
            </p>
          <button type="button" class="close text-secondary" data-dismiss="alert">&times;</button>
        </div>

         
    </div>
</body>
</html>
